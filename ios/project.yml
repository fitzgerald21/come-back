name: ComeBack
options:
  bundleIdPrefix: com.ryanfitzgerald
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  ComeBack:
    type: application
    platform: iOS
    sources:
      - path: ComeBack
        excludes: ["GoogleService-Info.plist"]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Bundle web app
        script: '"$SRCROOT/scripts/bundle-web.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfitzgerald.comeback
        PRODUCT_NAME: Come back
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ComeBack/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GTK9G9EVU8
