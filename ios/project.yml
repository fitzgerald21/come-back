name: ComeBack
options:
  bundleIdPrefix: com.ryanfitzgerald
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  ComeBack:
    type: application
    platform: iOS
    sources:
      - path: ComeBack
        excludes: ["GoogleService-Info.plist"]
      - path: Shared
    dependencies:
      - target: ComeBackWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Bundle web app
        script: '"$SRCROOT/scripts/bundle-web.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfitzgerald.comeback
        PRODUCT_NAME: Come back
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ComeBack/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GTK9G9EVU8
  ComeBackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ComeBackWidgets
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanfitzgerald.comeback.widgets
        PRODUCT_NAME: ComeBackWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ComeBackWidgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GTK9G9EVU8
        SKIP_INSTALL: YES
# Only the app gets a scheme. The widget extension is Live Activity only, so Xcode can't "show" it on its own
# (running it directly fails with "Failed to get descriptors for extensionBundleID"); it's built and embedded with the app.
schemes:
  ComeBack:
    build:
      targets:
        ComeBack: all
    run:
      config: Debug
    archive:
      config: Release
